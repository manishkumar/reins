<svg xmlns="http://www.w3.org/2000/svg" width="908" height="464" viewBox="0 0 908 464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<rect width="908" height="464" rx="10" fill="#0d1117"/>
<path d="M0 10 a10 10 0 0 1 10 -10 h888 a10 10 0 0 1 10 10 v26 h-908 z" fill="#161b22"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
<circle cx="40" cy="18" r="5.5" fill="#febc2e"/>
<circle cx="60" cy="18" r="5.5" fill="#28c840"/>
<text x="454" y="22" text-anchor="middle" fill="#8b949e" font-size="12">reins guard list — deny, ask, hold</text>
<text y="63" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">$ reins guard list</tspan></text>
<text y="83" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="700">Guard rules — deny is a hard veto; ask escalates to you; hold parks for later:</tspan></text>
<text y="103" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">rm-rf               </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#bc8cff">bash </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">\brm\b[^;&amp;|]*?\s(?:-[a-z]*r[a-z]*\b|--recursive\b)</tspan></text>
<text y="123" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Recursive rm (rm -rf / --recursive) is blocked by a reins guard.</tspan></text>
<text y="143" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">git-force-push      </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#bc8cff">bash </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">git\s+push\b.*(--force\b|--force-with-lease\b|-f\b)</tspan></text>
<text y="163" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Force-pushing is blocked by a reins guard (history rewrite).</tspan></text>
<text y="183" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">git-hard-reset      </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#bc8cff">bash </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">git\s+reset\s+--hard\b</tspan></text>
<text y="203" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">git reset --hard is blocked by a reins guard (discards work).</tspan></text>
<text y="223" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">sql-drop            </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#bc8cff">bash </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">\b(DROP\s+(TABLE|DATABASE|SCHEMA)|TRUNCATE\s+TABLE)\b</tspan></text>
<text y="243" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Destructive SQL (DROP/TRUNCATE) is blocked by a reins guard.</tspan></text>
<text y="263" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">curl-pipe-shell     </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#bc8cff">bash </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">(curl|wget)\b[^|]*\|\s*(sudo\s+)?(sh|bash|zsh)\b</tspan></text>
<text y="283" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Piping a downloaded script straight into a shell is blocked by a reins guard.</tspan></text>
<text y="303" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">write-dotenv        </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#58a6ff">path </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">**/.env*</tspan></text>
<text y="323" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Writing to a .env file is blocked by a reins guard (secrets).</tspan></text>
<text y="343" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">write-dotenv-bash   </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#bc8cff">bash </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">(&gt;&gt;?|\btee\b|\bcp\b|\bmv\b)\s*[^|;&amp;]*\.env(\.[\w.-]+)?(\s|$|"|')</tspan></text>
<text y="363" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Writing to a .env file via the shell is blocked by a reins guard (secrets).</tspan></text>
<text y="383" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">touch-git-internals </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#58a6ff">path </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#ff7b72">deny</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">**/.git/**</tspan></text>
<text y="403" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Modifying .git internals is blocked by a reins guard.</tspan></text>
<text y="423" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#8b949e">bash-git-s-push-b   </tspan><tspan x="190.7" fill="#e6edf3"> </tspan><tspan x="198.5" fill="#bc8cff">bash </tspan><tspan x="237.8" fill="#e6edf3"> </tspan><tspan x="245.6" fill="#39c5cf">hold</tspan><tspan x="277.1" fill="#e6edf3"> </tspan><tspan x="284.9" fill="#39c5cf">git\s+push\b</tspan></text>
<text y="443" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                                  </tspan><tspan x="284.9" fill="#8b949e">Pushing to the public repo waits for Manish's sign-off (hold queue dogfood).</tspan></text>
</svg>
