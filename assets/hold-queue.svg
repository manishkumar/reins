<svg xmlns="http://www.w3.org/2000/svg" width="719" height="644" viewBox="0 0 719 644" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<rect width="719" height="644" rx="10" fill="#0d1117"/>
<path d="M0 10 a10 10 0 0 1 10 -10 h699 a10 10 0 0 1 10 10 v26 h-719 z" fill="#161b22"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
<circle cx="40" cy="18" r="5.5" fill="#febc2e"/>
<circle cx="60" cy="18" r="5.5" fill="#28c840"/>
<text x="359.5" y="22" text-anchor="middle" fill="#8b949e" font-size="12">the hold queue — park, review, approve</text>
<text y="63" xml:space="preserve"><tspan x="18.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">$</tspan><tspan x="25.9" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="33.7" textLength="651.5" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">reins guard add bash "npm install" --hold --reason "Dependencies need my sign-off."</tspan></text>
<text y="83" xml:space="preserve"><tspan x="18.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#3fb950">✓</tspan><tspan x="25.9" textLength="102.0" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> Added guard </tspan><tspan x="127.9" textLength="86.3" lengthAdjust="spacingAndGlyphs" fill="#39c5cf">npm-install</tspan><tspan x="214.3" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="222.1" textLength="47.1" lengthAdjust="spacingAndGlyphs" fill="#8b949e">(hold)</tspan></text>
<text y="103" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="557.4" lengthAdjust="spacingAndGlyphs" fill="#8b949e">Matching actions will park in the queue: reins pending / approve / deny</tspan></text>
<text y="143" xml:space="preserve"><tspan x="18.0" textLength="392.5" lengthAdjust="spacingAndGlyphs" fill="#8b949e"># …you step away. The agent hits the rule mid-run:</tspan></text>
<text y="183" xml:space="preserve"><tspan x="18.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">⏺</tspan><tspan x="25.9" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="33.7" textLength="31.4" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">Bash</tspan><tspan x="65.1" textLength="149.2" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">(npm install chalk)</tspan></text>
<text y="203" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="188.4" lengthAdjust="spacingAndGlyphs" fill="#8b949e">⎿  PreToolUse:Bash says:</tspan><tspan x="222.1" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="229.9" textLength="54.9" lengthAdjust="spacingAndGlyphs" fill="#8b949e">[reins]</tspan><tspan x="284.9" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="292.8" textLength="47.1" lengthAdjust="spacingAndGlyphs" fill="#d29922">⏸ HELD</tspan><tspan x="339.8" textLength="149.2" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  npm install chalk</tspan></text>
<text y="223" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="102.0" lengthAdjust="spacingAndGlyphs" fill="#8b949e">     approve:</tspan><tspan x="135.8" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="143.6" textLength="172.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">reins approve da931615</tspan><tspan x="316.3" textLength="23.5" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">   </tspan><tspan x="339.8" textLength="204.1" lengthAdjust="spacingAndGlyphs" fill="#8b949e">·   see all: reins pending</tspan></text>
<text y="243" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">⎿</tspan><tspan x="41.5" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="57.3" textLength="596.6" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">Error: Dependencies need my sign-off. [reins hold] This action is parked for</tspan></text>
<text y="263" xml:space="preserve"><tspan x="18.0" textLength="39.3" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">     </tspan><tspan x="57.3" textLength="643.7" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">approval (id da931615) — it will not run until the developer approves it. Continue</tspan></text>
<text y="283" xml:space="preserve"><tspan x="18.0" textLength="39.3" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">     </tspan><tspan x="57.3" textLength="290.4" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">with work that does not depend on it.</tspan></text>
<text y="323" xml:space="preserve"><tspan x="18.0" textLength="439.6" lengthAdjust="spacingAndGlyphs" fill="#8b949e"># …the agent moves on to other work. When you look over:</tspan></text>
<text y="363" xml:space="preserve"><tspan x="18.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">$</tspan><tspan x="25.9" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="33.7" textLength="102.0" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">reins pending</tspan></text>
<text y="383" xml:space="preserve"><tspan x="18.0" textLength="117.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">Pending actions</tspan><tspan x="135.8" textLength="368.9" lengthAdjust="spacingAndGlyphs" fill="#8b949e"> — parked by hold rules, awaiting your decision</tspan></text>
<text y="423" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="62.8" lengthAdjust="spacingAndGlyphs" fill="#39c5cf">da931615</tspan><tspan x="96.5" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="112.2" textLength="23.5" lengthAdjust="spacingAndGlyphs" fill="#8b949e">14m</tspan><tspan x="135.8" textLength="39.3" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">     </tspan><tspan x="175.0" textLength="62.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">7e973de1</tspan><tspan x="237.8" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="253.5" textLength="31.4" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">Bash</tspan><tspan x="284.9" textLength="188.4" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">     npm install chalk  </tspan><tspan x="473.3" textLength="102.0" lengthAdjust="spacingAndGlyphs" fill="#8b949e">[npm-install]</tspan></text>
<text y="463" xml:space="preserve"><tspan x="18.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">$</tspan><tspan x="25.9" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="33.7" textLength="172.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">reins approve da931615</tspan></text>
<text y="483" xml:space="preserve"><tspan x="18.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#3fb950">✓</tspan><tspan x="25.9" textLength="78.5" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> Approved </tspan><tspan x="104.3" textLength="62.8" lengthAdjust="spacingAndGlyphs" fill="#39c5cf">da931615</tspan><tspan x="167.2" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="175.0" textLength="196.3" lengthAdjust="spacingAndGlyphs" fill="#8b949e">(Bash: npm install chalk)</tspan></text>
<text y="503" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="628.0" lengthAdjust="spacingAndGlyphs" fill="#8b949e">One-shot: the next attempt of this exact call passes, then the rule holds again.</tspan></text>
<text y="523" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="259.1" lengthAdjust="spacingAndGlyphs" fill="#8b949e">The session was steered to retry.</tspan></text>
<text y="563" xml:space="preserve"><tspan x="18.0" textLength="502.4" lengthAdjust="spacingAndGlyphs" fill="#8b949e"># …back in the still-running session, at its next tool boundary:</tspan></text>
<text y="603" xml:space="preserve"><tspan x="18.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">⏺</tspan><tspan x="25.9" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3"> </tspan><tspan x="33.7" textLength="31.4" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="700">Bash</tspan><tspan x="65.1" textLength="149.2" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">(npm install chalk)</tspan></text>
<text y="623" xml:space="preserve"><tspan x="18.0" textLength="15.7" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">  </tspan><tspan x="33.7" textLength="400.3" lengthAdjust="spacingAndGlyphs" fill="#8b949e">⎿  added 1 package, and audited 2 packages in 595ms</tspan></text>
</svg>
