<svg xmlns="http://www.w3.org/2000/svg" width="735" height="644" viewBox="0 0 735 644" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<rect width="735" height="644" rx="10" fill="#0d1117"/>
<path d="M0 10 a10 10 0 0 1 10 -10 h715 a10 10 0 0 1 10 10 v26 h-735 z" fill="#161b22"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
<circle cx="40" cy="18" r="5.5" fill="#febc2e"/>
<circle cx="60" cy="18" r="5.5" fill="#28c840"/>
<text x="367.5" y="22" text-anchor="middle" fill="#8b949e" font-size="12">the hold queue — captured while building reins itself</text>
<text y="63" xml:space="preserve"><tspan x="18.0" fill="#8b949e">$</tspan><tspan x="25.9" fill="#e6edf3"> reins guard add bash "git\s+push\b" --hold --reason "Pushes wait for my sign-off."</tspan></text>
<text y="83" xml:space="preserve"><tspan x="18.0" fill="#3fb950">✓ Added guard </tspan><tspan x="127.9" fill="#3fb950" font-weight="700">bash-git-s-push-b</tspan><tspan x="261.4" fill="#3fb950"> (hold)</tspan></text>
<text y="103" xml:space="preserve"><tspan x="18.0" fill="#8b949e">  Matching actions will park in the queue: reins pending / approve / deny</tspan></text>
<text y="143" xml:space="preserve"><tspan x="18.0" fill="#8b949e"># …you leave. Later, the unattended agent tries to push:</tspan></text>
<text y="183" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#ff7b72">⛔</tspan><tspan x="41.5" fill="#e6edf3">  </tspan><tspan x="57.3" fill="#8b949e">Bash</tspan><tspan x="88.6" fill="#e6edf3">  git push origin main</tspan></text>
<text y="203" xml:space="preserve"><tspan x="18.0" fill="#8b949e">     Pushing to the public repo waits for Manish's sign-off. [reins hold]</tspan></text>
<text y="223" xml:space="preserve"><tspan x="18.0" fill="#8b949e">     This action is parked for approval (id f27f93b3) — it will not run until the</tspan></text>
<text y="243" xml:space="preserve"><tspan x="18.0" fill="#8b949e">     developer approves it. Continue with work that does not depend on it.</tspan></text>
<text y="283" xml:space="preserve"><tspan x="18.0" fill="#8b949e"># …the agent moves on to other work. In the morning:</tspan></text>
<text y="323" xml:space="preserve"><tspan x="18.0" fill="#8b949e">$</tspan><tspan x="25.9" fill="#e6edf3"> reins pending</tspan></text>
<text y="343" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="700">Pending actions</tspan><tspan x="135.8" fill="#8b949e"> — parked by hold rules, awaiting your decision</tspan></text>
<text y="383" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#39c5cf">f27f93b3</tspan><tspan x="96.5" fill="#e6edf3">  </tspan><tspan x="112.2" fill="#8b949e">1m</tspan><tspan x="127.9" fill="#e6edf3">       </tspan><tspan x="182.8" fill="#8b949e">a7db916b</tspan><tspan x="245.6" fill="#e6edf3">  Bash     git push origin main </tspan><tspan x="496.8" fill="#8b949e">[bash-git-s-push-b]</tspan></text>
<text y="423" xml:space="preserve"><tspan x="18.0" fill="#8b949e">Approve one: </tspan><tspan x="120.0" fill="#e6edf3">reins approve &lt;id&gt;</tspan><tspan x="261.4" fill="#8b949e">   Refuse one: </tspan><tspan x="379.1" fill="#e6edf3">reins deny &lt;id&gt; [--steer "do this instead"]</tspan></text>
<text y="463" xml:space="preserve"><tspan x="18.0" fill="#8b949e">$</tspan><tspan x="25.9" fill="#e6edf3"> reins deny f27f93b3 --steer "i pushed myself"</tspan></text>
<text y="483" xml:space="preserve"><tspan x="18.0" fill="#ff7b72">✗ Refused </tspan><tspan x="96.5" fill="#ff7b72" font-weight="700">f27f93b3</tspan><tspan x="159.3" fill="#8b949e"> (Bash: git push origin main)</tspan></text>
<text y="503" xml:space="preserve"><tspan x="18.0" fill="#8b949e">  Steered the session instead: "i pushed myself"</tspan></text>
<text y="543" xml:space="preserve"><tspan x="18.0" fill="#8b949e"># …which reaches the agent inside its session, at its next tool call:</tspan></text>
<text y="583" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#bc8cff">[reins — live steering from the developer running this session]</tspan></text>
<text y="603" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  Your parked action f27f93b3 (Bash: git push origin main) was refused.</tspan></text>
<text y="623" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  Instead: </tspan><tspan x="104.3" fill="#e6edf3" font-weight="700">i pushed myself</tspan></text>
</svg>
